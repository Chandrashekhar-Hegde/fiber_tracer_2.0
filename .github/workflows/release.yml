name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package with twine
        run: twine check dist/*

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

      - name: Verify model checkpoint URL (if model release)
        if: contains(github.ref_name, 'unet')
        run: |
          curl -L -I -o /dev/null -w "%{http_code}" \
            "https://github.com/Chandrashekhar-Hegde/fiber_tracer_2.0/releases/download/${{ github.ref_name }}/fiber_unet_v2_full.pt" || true

