name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[structure,skeleton,dev]"
          pip install plotly
      - name: Test
        run: pytest tests/ -v --ignore=tests/test_benchmark_regression.py
      - name: Benchmark regression
        run: pytest tests/test_benchmark_regression.py -v
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: benchmark_results/benchmark_results.json
      - name: License check
        run: |
          pip install pip-licenses
          pip-licenses --format=json --output-file=licenses.json
          python - <<'PY'
          import json, sys
          with open('licenses.json') as f:
              data = json.load(f)
          # Some packages list historical/optional GPL classifiers while the runtime
          # library is under a permissive license. Allow-list those known false-positives.
          allowlist = {"docutils"}  # runtime is public-domain/BSD; only Emacs helper is GPL
          bad = [
              (p['Name'], p['License']) for p in data
              if p['Name'] not in allowlist
              and any(x in p['License'].upper() for x in ['GPL', 'AGPL', 'SSPL'])
          ]
          if bad:
              print('Forbidden licenses found:')
              for name, lic in bad:
                  print(f'  {name}: {lic}')
              sys.exit(1)
          print('No forbidden licenses found.')
          PY
