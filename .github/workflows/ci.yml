name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[structure,skeleton,dev]"
          pip install plotly
      - name: Test
        run: pytest tests/ -v --ignore=tests/test_benchmark_regression.py
      - name: Benchmark regression
        run: pytest tests/test_benchmark_regression.py -v
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: benchmark_results/benchmark_results.json
      - name: License check
        run: |
          pip install pip-licenses
          python scripts/check_licenses.py
