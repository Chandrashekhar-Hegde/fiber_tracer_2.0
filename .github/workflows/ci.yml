name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[structure,skeleton,ml,dev]"
          pip install plotly
      - name: Test
        run: pytest tests/ -v --ignore=tests/test_benchmark_regression.py
      - name: Benchmark regression
        run: pytest tests/test_benchmark_regression.py -v
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: benchmark_results/benchmark_results.json
      - name: License check
        run: |
          pip install pip-licenses
          python scripts/check_licenses.py

  ml-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with ML extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,dev]"
      - name: Run ML tests
        run: pytest tests/test_ml_backend.py tests/test_pipeline_backends.py tests/test_training_dataset.py -v
