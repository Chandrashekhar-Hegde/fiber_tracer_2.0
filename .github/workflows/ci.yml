name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[structure,skeleton,ml,dev]"
          pip install plotly
      - name: Test
        run: pytest tests/ -v --ignore=tests/test_benchmark_regression.py
      - name: Benchmark regression
        run: pytest tests/test_benchmark_regression.py -v
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: benchmark_results/benchmark_results.json
      # pip-licenses reads package metadata, which does not vary by platform;
      # running this once is a policy gate, not a portability check.
      - name: License check
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install pip-licenses
          python scripts/check_licenses.py

  # Optional extras in isolation: the `test` job above installs structure and
  # skeleton alongside ml, so it cannot catch an ml path that depends on them.
  # `dvc` (spam) is installed nowhere else -- without it every test in
  # test_deformation.py hits its `pytest.importorskip("spam")` and skips
  # silently, which is how DVC/DIC shipped with no CI coverage at all.
  # ubuntu-only: spambind publishes a cp312 manylinux wheel, but on macOS it
  # builds from source and needs gmp (see correlation/core.py).
  extras-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # spam.DIC imports spam.mesh -> gmsh, which dlopens libGLU.so.1 at import
      # time. GitHub's headless ubuntu image does not ship it, so the import
      # fails with OSError before any correlation code runs.
      - name: Install libGLU (gmsh runtime dependency)
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - name: Install with ML and DVC extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,dvc,dev]"
      - name: Verify spam is importable
        run: python -c "import spam.DIC, spam.deformation"
      - name: Run ML and correlation tests
        run: pytest tests/test_ml_backend.py tests/test_pipeline_backends.py tests/test_training_dataset.py tests/test_deformation.py -v
