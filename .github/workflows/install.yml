name: Install & Verify

on:
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - ".github/workflows/install.yml"
      - "pyproject.toml"
      - "src/**"
      - "tui/**"
      - "tests/**"
  pull_request:
    branches: [main, master]
    paths:
      - "scripts/**"
      - ".github/workflows/install.yml"
      - "pyproject.toml"
      - "src/**"
      - "tui/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  install-verify:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (Unix)
        if: runner.os != 'Windows'
        run: ./scripts/install.sh
        shell: bash

      - name: Verify (Unix)
        if: runner.os != 'Windows'
        run: ./scripts/verify.sh
        shell: bash

      - name: Install (Windows)
        if: runner.os == 'Windows'
        run: .\scripts\install.ps1
        shell: pwsh

      - name: Verify (Windows)
        if: runner.os == 'Windows'
        run: .\scripts\verify.ps1
        shell: pwsh
