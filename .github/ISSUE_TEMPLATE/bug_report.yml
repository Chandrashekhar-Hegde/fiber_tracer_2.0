name: Bug report
description: Report a problem with fiber-tracer.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the sections below so we can reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: fiber-tracer version
      placeholder: e.g., 3.3.0
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: e.g., 3.11.4
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide a minimal command or script that triggers the bug.
      placeholder: |
        fiber-tracer --data sample.tif --output out/ --voxel-spacing 1 1 1 --fiber-diameter 6
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      render: text
  - type: textarea
    id: data
    attributes:
      label: Data details
      description: Describe your input data format, size, and any preprocessing steps.
