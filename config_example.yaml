# Example single-volume configuration for fiber-tracer.
# Usage: fiber-tracer --config config_example.yaml --data path/to/stack.tif --output results/
#
# All physical lengths are in micrometres (µm).
# voxel_spacing_um is given in (z, y, x) order and may be a list [z, y, x]
# or a dict {z: ..., y: ..., x: ...}.

data_path: "path/to/stack.tif"
output_dir: "results/"
voxel_spacing_um: [1.0, 1.0, 1.0]
fiber_diameter_um: 6.0
regime: "auto"

processing:
  denoise_sigma: 0.8
  normalize: true

segmentation:
  method: "otsu"  # "otsu", "watershed", or "unet"
  # model_path: "models/fiber_unet.pt"  # required when method is "unet"

orientation:
  sigma_um: 1.0
  rho_um: 2.0
  window_size_um: 4.0

analysis:
  compute_morphometry: true
  compute_orientation_tensor: true
  compute_tda_descriptors: false
